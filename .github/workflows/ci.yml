name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: 0.2.7
          node-version: 24.18.1
          cache: true

      - name: Install frozen dependency graph
        run: vp install --frozen-lockfile

      - name: Audit production dependencies
        run: vp pm audit --production --level moderate

      - name: Check generated-file drift
        run: vp run check:generated

      - name: Format, lint, type-check, and boundaries
        run: vp run check

      - name: Test boundary checker
        run: vp run test:boundaries

      - name: Run unit tests
        run: vp test

      - name: Build deployable Worker
        run: vp run build

      - name: Run single-Worker integration tests
        run: vp run test:integration

      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run browser tests
        run: vp run test:e2e
